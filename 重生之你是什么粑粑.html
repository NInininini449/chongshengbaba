  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #fdf3e3 0%, #fde8e0 50%, #fbe3ec 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }
  .card {
    width: 100%; max-width: 520px;
    background: #fffdf9;
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(150, 100, 60, 0.18);
    padding: 40px 32px;
    text-align: center;
    position: relative;
    animation: pop .45s ease;
  }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }
  @keyframes wiggle { 0%,100% { transform: rotate(-3deg);} 50% { transform: rotate(3deg);} }
  @keyframes fadeUp { from { opacity:0; transform: translateY(16px);} to { opacity:1; transform: translateY(0);} }

  h1 { font-size: 30px; color: #6b4a2f; margin-bottom: 10px; letter-spacing: 1px; }
  .subtitle { color: #a0876a; font-size: 15px; margin-bottom: 26px; line-height: 1.7; }
  .emoji-big { font-size: 64px; display: inline-block; animation: float 2.6s ease-in-out infinite; }

  .btn {
    display: inline-block; margin-top: 18px;
    background: linear-gradient(135deg, #e8a15a, #d97b4f);
    color: #fff; border: none; font-size: 18px; font-weight: bold;
    padding: 14px 44px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(217, 123, 79, .4);
    transition: transform .15s, box-shadow .15s;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(217,123,79,.5); }
  .btn:active { transform: translateY(0); }

  /* 进度条 */
  .progress-wrap { background: #f3e7d7; border-radius: 999px; height: 12px; margin: 6px 0 22px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f0b46a, #e08a55); border-radius: 999px; transition: width .35s ease; }
  .progress-text { color: #b09477; font-size: 13px; margin-bottom: 8px; }

  .question { font-size: 21px; font-weight: bold; color: #5c4128; margin-bottom: 24px; line-height: 1.6; animation: fadeUp .4s ease; }
  .q-tag { display: inline-block; background: #fbe8d2; color: #c07a3a; font-size: 12px; padding: 4px 14px; border-radius: 999px; margin-bottom: 14px; }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    background: #fff; border: 2px solid #f0e0cb; border-radius: 16px;
    padding: 14px 18px; text-align: left; cursor: pointer;
    font-size: 16px; color: #6b5236; line-height: 1.55;
    transition: all .18s;
    animation: fadeUp .4s ease;
  }
  .option:hover { border-color: #e8a15a; background: #fff8ee; transform: translateX(4px); }
  .option .letter { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center; background: #f6e3c8; color: #b57b3f; border-radius: 50%; font-size: 13px; font-weight: bold; margin-right: 10px; }

  /* 结果页 */
  .result-emoji { animation: wiggle 2s ease-in-out infinite; display: inline-block; margin-bottom: 6px; }
  .result-title { font-size: 26px; color: #6b4a2f; margin: 8px 0 4px; }
  .result-sub { color: #c0895a; font-size: 14px; margin-bottom: 18px; }
  .result-img { margin: 4px auto 10px; }
  .result-desc { color: #7a5f42; font-size: 16px; line-height: 1.9; text-align: left; background: #fdf6ea; border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
  .quote { color: #c07a3a; font-style: italic; font-size: 15px; margin-bottom: 20px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 8px; }
  .tag { background: #fdeedd; color: #bd7d3c; font-size: 13px; padding: 6px 14px; border-radius: 999px; }
  .btn-secondary { background: #fff; color: #c07a3a; border: 2px solid #ecc79a; box-shadow: none; }
  .btn-secondary:hover { background: #fff8ee; box-shadow: none; }

  .deco { position: fixed; font-size: 30px; opacity: .35; animation: float 3.4s ease-in-out infinite; pointer-events: none; }
  .hidden { display: none; }
</style>
</head>

    <div class="question">${q.q}</div>
    <div class="options">
      ${idx.map((oi,i)=>`<div class="option" style="animation-delay:${i*0.07}s" onclick="answer('${q.opts[oi][1]}')"><span class="letter">${letters[i]}</span>${q.opts[oi][0]}</div>`).join("")}
    </div>`;
  requestAnimationFrame(()=>{ const bar=app.querySelector(".progress-bar"); if(bar) bar.style.width=(qi/QUESTIONS.length*100)+"%"; });
}

function answer(t){
  scores[t] = (scores[t]||0) + 1;
  qi++;
  if (qi < QUESTIONS.length) renderQuestion();
  else renderResult();
}

function renderResult(){
  let best = null, bv = -1;
  for (const k in scores) if (scores[k] > bv) { bv = scores[k]; best = k; }
  const r = TYPES[best];
  app.innerHTML = `
    <span class="q-tag">🕯️ 重生完成，你的真身是 ——</span>
    <div class="result-img" style="animation:fadeUp .5s ease">${poopSVG(best, 230)}</div>
    <div class="result-title">${r.title}</div>
    <div class="result-sub">${r.sub}</div>
    <div class="tags">${r.tags.map(t=>`<span class="tag"># ${t}</span>`).join("")}</div>
    <div class="result-desc">${r.desc}</div>
    <div class="quote">${r.quote}</div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn" onclick="startQuiz()">再测一次 🔄</button>
      <button class="btn btn-secondary" onclick="saveImage()">保存形象卡 💾</button>
    </div>`;
}

function saveImage(){
  const svg = app.querySelector(".result-emoji, .result-img svg");
  const svgEl = app.querySelector(".result-img svg");
  if (!svgEl) return;
  const xml = new XMLSerializer().serializeToString(svgEl);
  const blob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = function(){
    const c = document.createElement("canvas");
    c.width = 220; c.height = 220;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fffdf9"; ctx.fillRect(0,0,220,220);
    ctx.drawImage(img, 0, 0);
    const a = document.createElement("a");
    a.download = "我的粑粑真身.png";
    a.href = c.toDataURL("image/png");
    a.click();
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

renderStart();
</script>
</body>
</html>
